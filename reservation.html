<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>여수 힐링스파 펜션 - 예약안내</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="여수 힐링스파 펜션 - 예약안내" />
  <meta property="og:description" content="전남 여수 낭만포차 펜션 여수 힐링 스파 펜션입니다. 낭만포차 거리가 가까운 이곳에서 사랑하는 가족, 커플과 즐거운 시간을 보내세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2022/01/06/0WSVx9IJPqG8.jpg" />
  <meta property="og:url" content="https://yeosuhealing.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="여수 힐링스파 펜션 - 예약안내" />
  <meta name="twitter:description" content="전남 여수 낭만포차 펜션 여수 힐링 스파 펜션입니다. 낭만포차 거리가 가까운 이곳에서 사랑하는 가족, 커플과 즐거운 시간을 보내세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2022/01/06/0WSVx9IJPqG8.jpg" />
  <meta name="naver-site-verification" content="0fb9e1e952a94a3972f4d0a9ddc600b2e34aff9a" />
  <meta name="google-site-verification" content="yhFrfuX8ruHg6TF3qYvWmxihLXZ-4QLWUVYLOKwyU_c" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 reservation.html (이용안내) -->
        <section id="content" class="sub5_1 sub_reservation">
          <div class="sub_visual_wide visual">
            <div class="sub_visual_box">
              <div class="swiper-container">
                <!-- data-* 속성 : data-reservation-hero-slides
                     pages.reservation.sections[0].hero.images[isSelected] -->
                <div class="swiper-wrapper" data-reservation-hero-slides></div>
                <div class="swiper-button-prev"><img src="images/arrow_left.png" alt="prev" /></div>
                <div class="swiper-button-next"><img src="images/arrow_right.png" alt="next" /></div>
              </div>
            </div>
            <div class="visual_title">
              <strong>RESERVATION,</strong>
              <div class="sub_cate_wrap">
                <ul>
                  <!-- data-* 속성 : data-booking-url (property.realtimeBookingId) -->
                  <li><a href="#!" target="_blank" data-booking-url>예약하기</a></li>
                  <li class="on"><a href="./reservation.html">이용안내</a></li>
                </ul>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cont">
            <div class="info_box">
              <dl>
                <dt class="view_cate_box">
                  <div class="sub_title">
                    <h3>INFORMATION</h3>
                    <p data-reservation-info-title>기본예약사항</p>
                  </div>
                </dt>
                <!-- data-* 속성 : data-reservation-info
                     property.usageGuide -->
                <dd data-reservation-info></dd>
              </dl>

              <dl>
                <dt class="view_cate_box">
                  <div class="sub_title">
                    <h3>REFUND GUIDE</h3>
                    <p data-reservation-refund-title>환불안내</p>
                  </div>
                </dt>
                <!-- data-* 속성 : data-reservation-refund-policies
                     property.refundPolicies (동적 생성) -->
                <dd data-reservation-refund-policies></dd>
              </dl>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/reservation-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/reservation.js"></script>
  </body>
</html>
